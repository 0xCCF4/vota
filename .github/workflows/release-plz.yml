name: release
on:
  push:
    branches:
      - 'main'

permissions:
  pull-requests: write
  contents: write
  id-token: write
  attestations: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Vota: actions-rs/toolchain replaced by
      # actions-rust-lang/setup-rust-toolchain, as in ci.yaml (archived, too old
      # to run; actionlint rejects it).
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: nightly

      # RELEASE_PLZ_PAT: a token that can push and open PRs. A release created
      # with the default GITHUB_TOKEN would not start release-archive.yml.
      - name: Run release-plz
        id: release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_PAT }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ github.workspace }}/target/release/vota
        continue-on-error: true
