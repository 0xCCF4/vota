<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Something went wrong</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f5f8; --surface: #fff; --text: #17202c; --muted: #535e6d; --border: #d6dce4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1116; --surface: #171b22; --text: #e7eaf0; --muted: #a4adbb; --border: #2d3440; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { box-sizing: border-box; width: min(32rem, calc(100% - 1.5rem)); margin: 1.5rem auto; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; }
  h1 { margin: 0 0 0.5rem; font-size: 1.5rem; line-height: 1.25; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Something went wrong</h1>
<p>This page could not be shown. Please try again later.</p>
</main>
</body>
</html>
